name: Verify Vercel Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vercel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vercel/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run production build and capture log
        id: production_build
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          tail -n 200 build.log > build-error.txt
          cat build-error.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-build-log
          path: vercel/build.log
          if-no-files-found: error
      - name: Fail when production build failed
        if: steps.production_build.outputs.status != '0'
        run: exit 1
